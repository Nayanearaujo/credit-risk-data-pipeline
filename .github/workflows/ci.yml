# ============================================================
# GitHub Actions — CI/CD Pipeline
# ============================================================
# Executa automaticamente a cada push ou Pull Request:
#   1. Instala dependências
#   2. Verifica qualidade do código (flake8 + black)
#   3. Executa todos os testes com cobertura
#
# Autor: Nayane Araújo | github.com/Nayanearaujo
# ============================================================

name: 🧪 CI — Testes e Qualidade de Código

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes e Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache de dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚙️ Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: 🔍 Verificar formatação com Black
        run: |
          black --check src/ tests/ --line-length 100

      - name: 🔍 Verificar estilo com Flake8
        run: |
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: 🧪 Executar testes com cobertura
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: 📊 Upload de relatório de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: credit-risk-pipeline-coverage
