# ============================================================
# GitHub Actions — CI/CD Pipeline
# ============================================================
# Executa automaticamente a cada push ou Pull Request:
#   1. Instala dependencias (via requirements-ci.txt)
#   2. Verifica qualidade do codigo (flake8)
#   3. Executa todos os testes com cobertura
#
# Autora: Nayane Araujo | github.com/Nayanearaujo
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes e Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verificar estilo com Flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=110 \
            --ignore=E501,W503,W504,E203,E402,F401 \
            --exclude=__pycache__,.git,notebooks/

      - name: Executar testes com cobertura
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short \
            -p no:warnings

      - name: Upload de relatorio de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: credit-risk-pipeline-coverage
          fail_ci_if_error: false
